<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Tu app de Finanzas</title>
<link rel="icon" type="image/png" sizes="512x512" href="../favicon.png">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@600;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/marca.css">
<style>
  .wrap{ max-width:1180px; margin:0 auto; padding:22px 16px 48px; }
  .barra{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .barra img{ height:30px; }
  .pill{ display:inline-block; background:rgba(255,255,255,.7); border:1px solid var(--vidrio-borde); border-radius:999px; padding:6px 14px; font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--morado); }
  .controles{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .acc{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .btn.chico{ margin-top:0; }
  .ocultar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; flex:1; min-width:260px; }
  .ocultar input{ flex:1; min-width:200px; width:auto; padding:10px 14px; border-radius:999px; }
  .lienzo{ background:#fff; border:1px solid #E4E5EE; border-radius:28px; padding:28px 28px 18px; box-shadow:0 8px 30px rgba(76,79,104,.07); }
  .lienzo header{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; }
  .lienzo h1{ font-size:clamp(24px,3.8vw,42px); color:var(--morado-oscuro); margin:0; line-height:1.15; font-weight:800; text-align:center; }
  .lienzo .cuenta{ font-size:13px; color:var(--morado); font-weight:700; margin-top:6px; }
  .lienzo .logo{ height:32px; order:-1; }
  .nube{ position:relative; width:100%; margin-top:8px; }
  .nube canvas{ display:block; width:100%; }
  .vacio{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--morado-suave); font-weight:600; padding:20px; }
  .pie-lienzo{ text-align:center; font-size:12px; color:var(--morado-suave); }
  .top{ margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
  .top span{ background:rgba(255,255,255,.8); border:1px solid rgba(126,132,174,.25); border-radius:999px; padding:5px 12px; font-size:12.5px; color:var(--morado-oscuro); }
  .top b{ color:var(--morado); }
  .error{ color:var(--alerta); font-size:13px; font-weight:600; min-height:18px; margin-top:10px; }
  .ejemplo{ background:var(--durazno); color:var(--morado-oscuro); border-radius:14px; padding:8px 14px; font-size:13px; font-weight:700; margin-bottom:12px; }
  body.captura .barra, body.captura .controles, body.captura .top, body.captura .ejemplo{ display:none !important; }
  body.captura{ background:#fff; }
  body.captura .blob{ display:none; }
  body.captura .wrap{ max-width:1500px; padding:14px; }
  body.captura .lienzo{ border:0; box-shadow:none; min-height:calc(100vh - 28px); display:flex; flex-direction:column; justify-content:center; }
  .aviso-captura{ position:fixed; left:50%; bottom:12px; transform:translateX(-50%); background:rgba(76,79,104,.85); color:#fff; font-size:12px; padding:6px 14px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .3s; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div><div class="blob blob-4"></div>
<main class="wrap">
  <div class="barra"><span class="pill">Panel · Tu app de Finanzas</span><img src="../assets/logo-feminario.png" alt="Feminario"></div>
  <div class="ejemplo" id="ejemplo" hidden>Datos de EJEMPLO para ver cómo queda. Las respuestas reales aparecen aquí cuando la gente responde.</div>

  <div class="controles">
    <div class="ocultar"><label for="excluir"><b>Ocultar palabras</b> (separadas por coma):</label><input type="text" id="excluir" placeholder="ej. dolor, plata, mucho"></div>
    <div class="acc">
      <button class="btn secundario chico" id="actualizar" type="button">Actualizar</button>
      <button class="btn chico" id="captura" type="button">Modo captura</button>
    </div>
  </div>

  <div class="lienzo" id="lienzo">
    <header>
      <div><h1>¿Qué dolor te gustaría escalar?</h1><div class="cuenta" id="cuenta"></div></div>
      <img class="logo" src="../assets/logo-feminario.png" alt="Feminario">
    </header>
    <div class="nube" id="nube"><canvas id="cv"></canvas><div class="vacio" id="vacio" hidden></div></div>
    <div class="pie-lienzo">@feminario.co</div>
  </div>
  <div class="top" id="top"></div>
  <div class="error" id="error" role="alert"></div>
  <div class="aviso-captura" id="aviso-captura">Presiona Esc para salir del modo captura</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
<script src="../assets/config.js?v=4"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var API = (window.FB_CFG || {}).API_URL;
  var DEMO = /[?&]demo=1/.test(location.search);
  var datos = null;   // { n: respuestas, p: [[palabra, veces], …] } con los dolores de la última pregunta
  var PALETA = ["#4C4F68", "#7E84AE", "#8A90B8", "#A7ABC8"];   // neutros de la identidad: de más oscuro (palabras más frecuentes) a más suave
  var sinTilde = function (t) { return t.normalize("NFD").replace(/[̀-ͯ]/g, ""); };

  // Solo para la vista de ejemplo: la misma cuenta que hace el script con las respuestas reales
  var STOP = new Set("a al algo ante como con cual de del e el ella en es esa ese esta este fue ha hay la las le lo los mas me mi mis muy ni no nos o para pero por que se si sin sobre su sus te tengo tiene tu un una y ya yo".split(" "));
  function ejemplo() {
    var t = ["Las deudas de la tarjeta", "No sé invertir y me da miedo", "No logro ahorrar a fin de mes", "Depender de otra persona para mi plata", "Ahorrar para mi fondo de emergencia", "El miedo a invertir", "Salir de deudas", "No tener un presupuesto claro", "Ahorrar para mi casa", "Aprender a invertir", "Las deudas me quitan la tranquilidad", "Ahorrar sin sentir culpa"];
    var cuenta = {}, forma = {};
    t.forEach(function (x) { (x.toLowerCase().match(/[\p{L}]+/gu) || []).forEach(function (w) { var k = sinTilde(w); if (k.length < 3 || STOP.has(k)) return; cuenta[k] = (cuenta[k] || 0) + 1; forma[k] = w; }); });
    return { n: t.length, p: Object.keys(cuenta).map(function (k) { return [forma[k], cuenta[k]]; }).sort(function (a, b) { return b[1] - a[1]; }) };
  }

  function pintar() {
    if (!datos) return;
    var fuera = new Set(($("excluir").value || "").split(",").map(function (x) { return sinTilde(x.trim().toLowerCase()); }).filter(Boolean));
    var lista = datos.p.filter(function (x) { return !fuera.has(sinTilde(String(x[0]))); }).slice(0, 90), n = datos.n;
    $("cuenta").textContent = n + (n === 1 ? " respuesta" : " respuestas") + (lista.length ? " · " + lista.length + " palabras" : "");
    var cv = $("cv"), W = Math.max(320, $("nube").clientWidth), H = Math.round(W * 0.5);
    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
    cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
    $("vacio").hidden = lista.length > 0; $("vacio").textContent = n ? "No quedan palabras para mostrar (revisa «Ocultar palabras»)." : "Todavía no hay respuestas.";
    $("top").innerHTML = lista.slice(0, 12).map(function (x) { return "<span><b>" + x[1] + "</b> · " + String(x[0]).replace(/[<>&]/g, "") + "</span>"; }).join("");
    if (!lista.length) return;
    var max = lista[0][1], min = lista[lista.length - 1][1], base = W / 14;
    WordCloud(cv, {
      list: lista, gridSize: Math.round(W / 50 * dpr), backgroundColor: "rgba(0,0,0,0)",
      fontFamily: "Montserrat, sans-serif", fontWeight: "700",
      weightFactor: function (v) { var t = max === min ? 1 : (v - min) / (max - min); return (base * 0.55 + base * 1.55 * Math.pow(t, 0.8)) * dpr; },
      color: function (w, v) { var t = max === min ? 1 : (v - min) / (max - min); return t > 0.66 ? PALETA[0] : t > 0.33 ? PALETA[1] : t > 0.12 ? PALETA[2] : PALETA[3]; },
      rotateRatio: 0.12, rotationSteps: 2, minRotation: -Math.PI / 2, maxRotation: -Math.PI / 2,
      shuffle: false, shrinkToFit: true, drawOutOfBound: false, ellipticity: 0.62, origin: [cv.width / 2, cv.height / 2]
    });
  }

  // El canvas no espera a la tipografía: se pinta cuando Montserrat ya cargó (si no, la nube sale en otra letra)
  function pintarListo() { var f = document.fonts && document.fonts.load ? document.fonts.load('700 24px Montserrat') : Promise.resolve(); f.then(pintar, pintar); }

  function cargar() {
    $("error").textContent = "";
    if (DEMO) { datos = ejemplo(); $("ejemplo").hidden = false; pintarListo(); return; }
    if (!API) { $("error").textContent = "El formulario aún no está conectado."; return; }
    fetch(API + "?accion=palabras").then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { $("error").textContent = "No pude leer las respuestas: " + (j.error || "error"); return; }
      datos = { n: j.n, p: j.p }; pintarListo();
    }).catch(function () { $("error").textContent = "No pude conectarme. Revisa tu conexión y toca Actualizar."; });
  }

  $("actualizar").onclick = cargar;
  $("excluir").addEventListener("input", function () { try { localStorage.setItem("fb_excluir", $("excluir").value); } catch (e) {} pintar(); });
  try { $("excluir").value = localStorage.getItem("fb_excluir") || ""; } catch (e) {}
  $("captura").onclick = function () {
    document.body.classList.add("captura"); setTimeout(pintar, 60);
    var a = $("aviso-captura"); a.style.opacity = ".9"; setTimeout(function () { a.style.opacity = "0"; }, 2500);
  };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && document.body.classList.contains("captura")) { document.body.classList.remove("captura"); setTimeout(pintar, 60); } });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(pintar, 150); });
  cargar();
})();
</script>
</body>
</html>
